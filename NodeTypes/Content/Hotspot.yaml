
'FormatD.HotspotEditor:Content.Hotspot':
  label: "${node.properties.hoverTitle ? node.properties.hoverTitle : node.properties.xPosition + 'x ' + node.properties.yPosition + 'y'}"
  superTypes:
    'Neos.Neos:Content': true
  ui:
    group: general
    label: i18n
    icon: icon-bullseye
    inspector:
      groups:
        document:
          label: i18n
  properties:
    xPosition:
      type: string
      defaultValue: '2'
      ui:
        label: i18n
        reloadIfChanged: false
        inspector:
          group: document
          editor: FormatD.HotspotEditor/HotspotEditor
    yPosition:
      type: string
      defaultValue: '2'
      ui:
        label: i18n
        reloadIfChanged: false
        inspector:
          group: document
          editor: FormatD.HotspotEditor/HotspotEditor
    link:
      type: reference
      ui:
        label: i18n
        reloadIfChanged: true
        inspector:
          group: document
          editorOptions:
            nodeTypes:
              - 'Neos.Neos:Document'
    hoverTitle:
      type: string
      ui:
        label: i18n
        reloadIfChanged: true
        inspector:
          group: document
          position: 50
